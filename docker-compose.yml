services:
  # Default local development service.
  # For postgres, start Compose with: docker compose --profile postgres up
  app:
    build: .
    container_name: lareferencia-embedding-service
    environment:
      SERVER_PORT: ${SERVER_PORT:-8989}
      DVP_ENABLED: ${DVP_ENABLED:-false}
      DVP_IMPORT_ENABLED: ${DVP_IMPORT_ENABLED:-false}
      DVP_IMPORT_FILE_ROOT: /data/imports
      DVP_WORKERS_ENABLED: ${DVP_WORKERS_ENABLED:-false}
      DVP_ROLE: ${DVP_ROLE:-API}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-OLLAMA}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434/v1/embeddings}
      OPENAI_URL: ${OPENAI_URL:-https://api.openai.com/v1/embeddings}
      OPENROUTER_URL: ${OPENROUTER_URL:-https://openrouter.ai/api/v1/embeddings}
      EMBEDDING_PROVIDER_API_KEY: ${EMBEDDING_PROVIDER_API_KEY:-}
      OLLAMA_CONNECT_TIMEOUT: ${OLLAMA_CONNECT_TIMEOUT:-5s}
      OLLAMA_REQUEST_TIMEOUT: ${OLLAMA_REQUEST_TIMEOUT:-30s}
      EMBEDDING_MAX_BATCH_SIZE: ${EMBEDDING_MAX_BATCH_SIZE:-128}
      EMBEDDING_MAX_INPUT_LENGTH: ${EMBEDDING_MAX_INPUT_LENGTH:-8192}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:-false}
      SPRING_FLYWAY_BASELINE_VERSION: "0"
      SPRING_DATASOURCE_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/embeddings}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-embeddings}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-embeddings}
    ports:
      - "${SERVER_PORT:-8989}:${SERVER_PORT:-8989}"
    volumes:
      - import-data:/data/imports
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  gemma-embeddings:
    profiles: ["gemma"]
    build: ./services/gemma-embeddings
    environment:
      GEMMA_TASK: ${GEMMA_TASK:-raw}
      GEMMA_DEVICE: ${GEMMA_DEVICE:-auto}
      GEMMA_REVISION: ${GEMMA_REVISION:-f9972ac22e696a105c482202646979e33e4b5a1e}
      GEMMA_CPU_THREADS: ${GEMMA_CPU_THREADS:-4}
      GEMMA_OFFLINE: ${GEMMA_OFFLINE:-false}
      HF_TOKEN: ${HF_TOKEN:-}
      GEMMA_API_KEY: ${GEMMA_API_KEY:-}
    ports:
      - "127.0.0.1:${GEMMA_PORT:-8000}:8000"
    volumes:
      - gemma-model-cache:/cache/huggingface

  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    container_name: embedding-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-embeddings}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-embeddings}
      POSTGRES_DB: ${POSTGRES_DB:-embeddings}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-embeddings} -d ${POSTGRES_DB:-embeddings}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    profiles:
      - postgres

volumes:
  postgres-data:
  import-data:
  gemma-model-cache:
