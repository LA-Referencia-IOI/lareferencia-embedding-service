services:
  # Default local development service.
  # For postgres, start Compose with: docker compose --profile postgres up
  app:
    image: maven:3.9.9-eclipse-temurin-21
    container_name: lareferencia-embedding-service
    working_dir: /workspace
    command: ./mvnw spring-boot:run
    environment:
      SERVER_PORT: ${SERVER_PORT:-8989}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-OLLAMA}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434/v1/embeddings}
      OPENAI_URL: ${OPENAI_URL:-https://api.openai.com/v1/embeddings}
      OPENROUTER_URL: ${OPENROUTER_URL:-https://openrouter.ai/api/v1/embeddings}
      EMBEDDING_PROVIDER_API_KEY: ${EMBEDDING_PROVIDER_API_KEY:-}
      OLLAMA_CONNECT_TIMEOUT: ${OLLAMA_CONNECT_TIMEOUT:-5s}
      OLLAMA_REQUEST_TIMEOUT: ${OLLAMA_REQUEST_TIMEOUT:-30s}
      EMBEDDING_MAX_BATCH_SIZE: ${EMBEDDING_MAX_BATCH_SIZE:-128}
      EMBEDDING_MAX_INPUT_LENGTH: ${EMBEDDING_MAX_INPUT_LENGTH:-8192}
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/embeddings}
      DB_USER: ${DB_USER:-embeddings}
      DB_PASSWORD: ${DB_PASSWORD:-embeddings}
    ports:
      - "${SERVER_PORT:-8989}:8989"
    volumes:
      - ./:/workspace
      - maven-cache:/root/.m2
      - app-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: embedding-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-embeddings}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-embeddings}
      POSTGRES_DB: ${POSTGRES_DB:-embeddings}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-embeddings} -d ${POSTGRES_DB:-embeddings}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    profiles:
      - postgres

volumes:
  app-data:
  maven-cache:
  postgres-data:
