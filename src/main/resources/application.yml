server:
  port: 8080

embedding:
  provider-url: ${EMBEDDING_PROVIDER_URL:http://172.16.115.105:11434/v1/embeddings}
  timeout-ms: ${EMBEDDING_TIMEOUT_MS:10000}

cache:
  type: ${CACHE_TYPE:rocksdb} # Options: rocksdb, postgres, sqlite
  rocksdb:
    path: ${ROCKSDB_PATH:./data/rocksdb/embedding-cache}
  sqlite:
    path: ${SQLITE_PATH:./data/sqlite/embedding-cache.db}

spring:
  application:
    name: embedding-cache
  web:
    error:
      include-message: always

  # PostgreSQL configuration used when cache.type=postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/embeddings}
    username: ${DB_USER:embeddings}
    password: ${DB_PASSWORD:embeddings}

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    org.lareferencia.embedding: DEBUG
